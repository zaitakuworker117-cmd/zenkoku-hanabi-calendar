<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

<title>全国花火大会カレンダー2026｜8月・9月の花火大会情報</title>

<meta
  name="description"
  content="2026年に開催される全国の花火大会情報を掲載。開催日、会場、打ち上げ数、アクセス、駐車場、有料席、公式サイトなどを確認できます。"
>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="keywords"
  content="花火大会,2026,花火,夏祭り,8月,9月,全国,花火大会情報"
>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🎆 全国花火大会カレンダー</h1>
    <p>2026年の花火大会を探そう！</p>
  </header>

  <main>

    <section class="search-box">

      <label for="prefecture-filter">
        都道府県から探す
      </label>

      <select id="prefecture-filter"
              onchange="filterFireworks()">

        <option value="すべて">すべて</option>

        <option value="北海道">北海道</option>
        <option value="青森県">青森県</option>
        <option value="岩手県">岩手県</option>
        <option value="宮城県">宮城県</option>
        <option value="秋田県">秋田県</option>
        <option value="山形県">山形県</option>
        <option value="福島県">福島県</option>

        <option value="茨城県">茨城県</option>
        <option value="千葉県">千葉県</option>

        <option value="福井県">福井県</option>
        <option value="長野県">長野県</option>
        <option value="愛知県">愛知県</option>
        <option value="京都府">京都府</option>
        <option value="大阪府">大阪府</option>
        <option value="兵庫県">兵庫県</option>
        <option value="和歌山県">和歌山県</option>

        <option value="広島県">広島県</option>
        <option value="愛媛県">愛媛県</option>

        <option value="鹿児島県">鹿児島県</option>

      </select>

    </section>

    <section>

      <h2 class="section-title">
        🎇 これから開催される花火大会
      </h2>

<div class="search-area">

  <input
    type="text"
    id="search-input"
    placeholder="🔍 花火大会名・都道府県で検索">

</div>

<div class="filter-area">

  <button onclick="filterByPeriod('all')">
    すべて
  </button>

  <button onclick="filterByPeriod('today')">
    今日開催
  </button>

  <button onclick="filterByPeriod('weekend')">
    今週末
  </button>

  <button onclick="filterByPeriod('month')">
    今月開催
  </button>

</div>

<div class="date-filter-buttons">
  <button onclick="filterByDate('2026-08-14')">8/14</button>
  <button onclick="filterByDate('2026-08-15')">8/15</button>
  <button onclick="filterByDate('2026-08-16')">8/16</button>
  <button onclick="filterByDate('2026-08-22')">8/22</button>
  <button onclick="filterByDate('2026-08-29')">8/29</button>
  <button onclick="filterByDate('2026-09-05')">9/5</button>
  <button onclick="displayFireworks(fireworks)">すべて</button>
</div>
      
      <div id="fireworks-list"></div>

    </section>

  </main>

  <footer>
    <p>
      ※開催日時・内容は変更される場合があります。
      お出かけ前に公式情報をご確認ください。
    </p>

    <p>
      © 2026 全国花火大会カレンダー
    </p>
  </footer>

  <script src="app.js"></script>

</body>

</html>
